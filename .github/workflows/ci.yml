name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check (all targets)
        run: cargo check --all-targets

      - name: Cargo test (lib + bins + tests)
        run: cargo test --all

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # NOTE: add smoke (cargo install --path . ; qmd --version ; small fixture cycle with gherkin or test), cross, container in follow-up PR.
      # See docs/verification.md and plan.md (full CI: windows included, parity with original qmd via explicit side-by-side).

