name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo check (all targets)
        run: cargo check --all-targets

      - name: Cargo test (lib + bins + tests)
        run: cargo test --all

      # TODO: add clippy, smoke (cargo install --path . ; qmd --version ; small fixture cycle), cross compile if needed.
      # Expand with original matrix ideas + container smoke when fixtures ready.
      # See plan.md for full CI requirements (include windows unlike original TS CI).